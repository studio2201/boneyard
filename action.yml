name: 'Boneyard Tech-Debt Radar'
description: 'Ranks repositories by tech-debt dormancy and emits remediation budgets'
author: 'studio2201'
branding:
  icon: 'activity'
  color: 'orange'

inputs:
  input:
    description: 'Hall of repos JSON metadata file to enrich'
    required: false
    default: 'hall.json'
  output:
    description: 'Scored JSON destination file'
    required: false
    default: 'scored.json'
  format:
    description: 'Output format (markdown, text, json)'
    required: false
    default: 'markdown'

runs:
  using: 'composite'
  steps:
    - name: Fast Bootstrap boneyard
      shell: bash
      run: |
        DEST="${XDG_BIN_HOME:-$HOME/.local/bin}"
        mkdir -p "$DEST"
        if ! command -v boneyard >/dev/null 2>&1; then
          if [ -f "${{ github.action_path }}/../install.sh" ]; then
            sh "${{ github.action_path }}/../install.sh" --dest "$DEST" boneyard
          elif [ -f "${{ github.action_path }}/install.sh" ]; then
            sh "${{ github.action_path }}/install.sh" --dest "$DEST" boneyard
          else
            curl -fsSL --retry 3 https://studio2201.com/install.sh | sh -s -- --dest "$DEST" boneyard
          fi
        fi
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Run Boneyard Scan & Report
      shell: bash
      run: |
        export PATH="${XDG_BIN_HOME:-$HOME/.local/bin}:$PATH"
        INPUT="${{ inputs.input }}"
        [ ! -f "$INPUT" ] && [ -f "catalog.json" ] && INPUT="catalog.json"

        set +e
        if [ -f "$INPUT" ]; then
          boneyard scan -i "$INPUT" --format "${{ inputs.format }}" > boneyard_summary.md 2>&1
          EC=$?
          if [ -n "${{ inputs.output }}" ]; then
            boneyard scan -i "$INPUT" -o "${{ inputs.output }}" --format json >/dev/null 2>&1
          fi
        else
          echo "No catalog file found at \`$INPUT\`. Skipping boneyard debt radar." > boneyard_summary.md
          EC=0
        fi
        set -e

        STATUS="🟢 WITHIN BUDGET"
        BADGE="https://img.shields.io/badge/Boneyard-HEALTHY-brightgreen"
        if [ ! -f "$INPUT" ]; then
          STATUS="⚪ SKIPPED"
          BADGE="https://img.shields.io/badge/Boneyard-SKIPPED-lightgrey"
        elif [ $EC -ne 0 ]; then
          STATUS="🔴 DEBT BREACH"
          BADGE="https://img.shields.io/badge/Boneyard-BREACH-red"
        fi

        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          {
            echo "## ⚡ Boneyard Tech-Debt Remediation Radar"
            echo ""
            echo "| Status | Catalog File | Badge |"
            echo "| :---: | :---: | :---: |"
            echo "| **${STATUS}** | \`${INPUT}\` | ![Boneyard](${BADGE}) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          cat boneyard_summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $EC
